[pytest]
# The suite spans two roots: engine/metrics tests in tests/, API tests in
# backend/tests/. Naming both here means `python -m pytest` from the repo root
# runs everything, which is what README and PROJECT_NOTES tell people to do.
testpaths = backend/tests tests
filterwarnings =
    ignore::DeprecationWarning:torch.*
    ignore::DeprecationWarning:torch_geometric.*
