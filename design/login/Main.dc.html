<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    a { color: #7cf000; text-decoration: none; }
    a:hover { color: #a5ff4d; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #080a0a; color: #e4e4e7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0">

  <!-- identity -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 26px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7cf000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <path d="M9 12l2 2 4-4"></path>
      </svg>
      <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #ffffff">MuleShield AI</div>
    </div>
    <div style="font-size: 11.5px; color: #71717a; letter-spacing: 0.01em">Cash-out interception console &middot; 1930 helpline</div>
  </div>

  <!-- sign-in card -->
  <div style="width: 384px; box-sizing: border-box; background: #0f1111; border: 1px solid #1e2323; border-radius: 8px; padding: 22px 22px 20px">

    <div style="display: flex; flex-direction: column; gap: 3px; margin-bottom: 18px">
      <div style="font-size: 15px; font-weight: 600; color: #ffffff">Sign in</div>
      <div style="font-size: 11.5px; color: #71717a">Every action you take is recorded against your name.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 13px">

      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 10.5px; font-weight: 500; color: #71717a; letter-spacing: 0.07em; text-transform: uppercase">Officer ID</div>
        <div style="width: 100%; box-sizing: border-box; background: #141717; border: 1px solid #1e2323; border-radius: 4px; padding: 9px 11px; font-size: 12.5px; color: #a1a1aa" class="mono">officer</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 10.5px; font-weight: 500; color: #71717a; letter-spacing: 0.07em; text-transform: uppercase">Password</div>
        <!-- focus state, so the accent border is visible in the mockup -->
        <div style="width: 100%; box-sizing: border-box; background: #141717; border: 1px solid #7cf000; border-radius: 4px; padding: 9px 11px; font-size: 12.5px; color: #e4e4e7; display: flex; align-items: center; justify-content: space-between">
          <span style="letter-spacing: 0.22em; color: #a1a1aa">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </div>
      </div>

      <button style="width: 100%; box-sizing: border-box; margin-top: 3px; padding: 9px 16px; border: 0; border-radius: 4px; background: #7cf000; color: #000000; font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; font-weight: 700; cursor: pointer">Sign in</button>

      <div style="display: flex; justify-content: flex-end; margin-top: 1px">
        <a href="#" style="font-size: 11.5px">Forgot password?</a>
      </div>

    </div>
  </div>

  <!-- provenance -->
  <div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 5px">
    <div class="mono" style="font-size: 10.5px; color: #52525b; letter-spacing: 0.04em">SIH26184 &middot; MINISTRY OF HOME AFFAIRS / I4C</div>
    <div style="font-size: 10.5px; color: #3f3f46">Authorised personnel only. Access is logged.</div>
  </div>

</div>
</x-dc>
</body>
</html>
